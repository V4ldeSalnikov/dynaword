# Publishes a release to PyPI when a version tag (v0.1.0, v0.2.0, ...) is pushed.
#
# Uses PyPI trusted publishing: no API token is stored anywhere. PyPI trusts
# this workflow file in this repository, running in the "pypi" environment.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Check that the tag matches the version in pyproject.toml
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - name: Build the wheel and sdist
        run: uv build

      - name: Smoke-test the wheel
        run: |
          uv venv
          uv pip install dist/*.whl
          .venv/bin/python -c "import dynaword.process_dataset, dynaword.tests"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
