# pyproject.toml of a dataset repo: keeps the dataset version, depends on the package.
[project]
name = "faroese-dynaword"
version = "0.0.6"
description = "Faroese Dynaword dataset repo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["dynaword>=0.1"]

[dependency-groups]
dev = ["ruff>=0.8.3,<0.15"]  # 0.15+ changes the default rules and formats Markdown code blocks

[tool.uv.sources]
# until the package is on PyPI: point at a local checkout or a git URL
dynaword = { path = "../dynaword-legacy", editable = true }

[tool.ruff]
# keep `make lint` on ruff's default rules and away from the datasheets
# (newer ruff versions also format Python code blocks inside Markdown files)
extend-exclude = ["*.md"]

[tool.ruff.lint]
# the rule set the repos have always used; newer ruff versions enable many more by default
select = ["E4", "E7", "E9", "F"]
